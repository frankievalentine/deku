name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: linux-stable
          add-job-id-key: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        # Includes the deploy and service migration tests that run real
        # containers against the runner's Docker daemon.
        env:
          DEKU_DOCKER_IT: "1"
        run: cargo test --all

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      # rust-toolchain.toml selects stable, so the declared floor is named
      # explicitly with `+` rather than through the default toolchain.
      - name: Install Rust 1.94.0
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Check
        run: cargo +1.94.0 check --workspace --all-targets --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit

  install-smoke:
    name: Install Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run installer smoke test
        run: ./scripts/test-install-smoke.sh

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2.2.0
      - run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Build
        run: bun run build
