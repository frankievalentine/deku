[workspace]
resolver = "2"
members = [
    "crates/deku",
    "crates/dekud",
    "crates/deku-core",
    "crates/deku-plugin-sdk",
    "plugins/deku-plugin-postgres",
    "plugins/deku-plugin-redis",
    "plugins/deku-plugin-mysql",
    "plugins/deku-plugin-letsencrypt",
    "plugins/deku-plugin-checks",
    "plugins/deku-plugin-storage",
    "plugins/deku-plugin-network",
    "plugins/deku-plugin-cron",
    "plugins/deku-plugin-git",
    "plugins/deku-plugin-domains",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "uuid", "chrono"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "stream", "multipart"] }
bollard = "0.20"
russh = "0.59"
cliclack = "0.5"
handlebars = "6"
config = "0.15"
toml = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
libloading = "0.9"
async-trait = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Too noisy / conflicts with our naming conventions
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Useful casts are fine in systems code
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
