<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Deku</title>
    <script>
      // Apply the stored look before first paint so the page never flashes the wrong theme.
      try {
        const prefs = JSON.parse(localStorage.getItem('deku-next-prefs') || '{}');
        const root = document.documentElement;
        const dark =
          prefs.theme === 'dark' ||
          (prefs.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        // Without storage the system preference applies once the app starts.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
